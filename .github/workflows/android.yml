name: Android
# Приложение Peregovorka для Android (mobile/android/): проверки, сборка APK/AAB, испытание на эмуляторе, выпуск по тегу android-vX.Y.Z.
# Серверные теги vX.Y.Z и канал обновления сервера не затрагиваются.
# Подпись: секреты ANDROID_KEYSTORE_B64 (base64 .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
#   • без них APK подписан отладочным ключом — годится для проверки, но не для постоянной установки (каждая сборка с другим ключом);
#   • с ними — один и тот же ключ из выпуска в выпуск: обновление ставится поверх. Ключ в репозиторий не попадает (docs/ANDROID_BUILD.md).
on:
  push:
    branches: [main, "feat/**"]
    tags: ["android-v[0-9]+.[0-9]+.[0-9]+"]
    paths: ["mobile/android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["mobile/android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: mobile/android } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Ключ подписи (если задан)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PEREGOVORKA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "SIGNED=debug-key" >> "$GITHUB_ENV"
          fi
      - name: Модульные тесты и линт
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Сборка APK и AAB
        env:
          PEREGOVORKA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PEREGOVORKA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PEREGOVORKA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
          if [ "$SIGNED" = release ]; then ./gradlew --no-daemon :app:bundleRelease; fi
      - name: Проверка подписи и состава
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3
          "$BT/aapt2" dump badging app/build/outputs/apk/release/app-release.apk | grep -E "^package|uses-permission" | head -20
      - name: Совместимость обновления с предыдущим выпуском (пакет, versionCode, подпись)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 ../../scripts/android_release_check.py app/build/outputs/apk/release/app-release.apk --expect-key $([ "$SIGNED" = release ] && echo release || echo debug) | tee update-check.txt
          mkdir -p prev; cur="${GITHUB_REF_NAME:-}"
          # предыдущий выпуск — самый свежий android-v* (кроме текущего тега)
          prevtag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName --jq '.[].tagName' | grep '^android-v' | grep -vx "$cur" | sort -V | tail -1)
          code=0
          if [ -n "$prevtag" ] && gh release download "$prevtag" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir prev; then
            prevapk=$(ls prev/*.apk | head -1)
            python3 ../../scripts/android_release_check.py app/build/outputs/apk/release/app-release.apk --previous "$prevapk" | tee -a update-check.txt; code=${PIPESTATUS[0]}
            echo "Сравнение с $prevtag ($(basename "$prevapk")), код $code" | tee -a update-check.txt
          else echo "Предыдущий выпуск не найден: сравнение пропущено" | tee -a update-check.txt; fi
          { echo "### Обновление поверх предыдущего выпуска"; echo '```'; cat update-check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # заметка для страницы выпуска: если ставить поверх нельзя — сказать об этом прямо
          if [ "$code" = 3 ]; then
            if [ "$SIGNED" = release ] && ! ls prev/*debugkey* >/dev/null 2>&1; then echo "::error::Сертификат подписи изменился относительно прошлого выпуска с постоянным ключом — обновление поверх не получится. Проверьте секреты подписи."; exit 1; fi
            echo "::warning::Обновление поверх предыдущего выпуска невозможно (другой сертификат подписи): пользователям нужно удалить прежнюю версию."
            printf '%s\n' "> **Установка поверх прежней версии невозможна.** Этот APK подписан другим ключом, чем предыдущий выпуск (${prevtag}): Android ответит «пакет обновления некорректен». Удалите прежнюю версию и установите эту (сохранённые серверы и вход придётся добавить заново). Начиная с выпуска с постоянным ключом обновления ставятся поверх." > update-note.md
          elif [ "$code" = 1 ]; then
            # на ветках версия совпадает с последним выпуском — это не ошибка; перед публикацией (тег) нарушение останавливает выпуск
            case "$GITHUB_REF" in refs/tags/android-v*) echo "::error::Нарушены правила обновления: пакет или versionCode."; exit 1 ;; *) echo "::notice::versionCode не новее последнего выпуска (ветка, не публикация)." ;; esac
          fi
      - name: Именование и контрольные суммы
        run: |
          V=$(cat VERSION); mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Peregovorka-$V-android.apk"
          if [ "$SIGNED" != release ]; then mv "out/Peregovorka-$V-android.apk" "out/Peregovorka-$V-android-debugkey.apk"; fi
          [ -f app/build/outputs/bundle/release/app-release.aab ] && cp app/build/outputs/bundle/release/app-release.aab "out/Peregovorka-$V-android.aab" || true
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          [ -f update-note.md ] && cp update-note.md out/UPDATE_NOTE.md || true          # заметка попадает на страницу выпуска (её убирает шаг «Выпуск»), в контрольных суммах её нет
      - uses: actions/upload-artifact@v7
        with: { name: android-build, path: mobile/android/out/*, retention-days: 30 }
      - uses: actions/upload-artifact@v7
        with:
          name: android-test-apks
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 3

  emulator:
    # Настоящий Android (эмулятор с KVM) на трёх версиях: Android 10 (окно сжимается по adjustResize), 14 и 16 (сквозной режим, клавиатура приходит как отступы).
    # Проверяются: Keystore, холодный запуск, экранная клавиатура на экранах приложения и в WebView, вход в конференцию (системные запросы разрешений, приложение остаётся
    # на переднем плане) и — к настоящему LiveKit (версия закреплена в deployment/compat.env) — подключение, служба переднего плана и возврат из фона.
    # Реальная камера, микрофон, Bluetooth и устройства производителей здесь не проверяются.
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34, 36]
    defaults: { run: { working-directory: mobile/android } }
    steps:
      - uses: actions/checkout@v7
      - name: KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: LiveKit (сервер разработки, версия из deployment/compat.env)
        working-directory: .
        run: |
          tag="$(sed -n 's/^TESTED_LIVEKIT_SERVER=//p' deployment/compat.env)"
          curl -fsSL "https://github.com/livekit/livekit/releases/download/${tag}/livekit_${tag#v}_linux_amd64.tar.gz" | tar xz livekit-server
          nohup ./livekit-server --dev --bind 0.0.0.0 --node-ip 10.0.2.2 > livekit.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:7880 >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:7880 && echo " LiveKit ${tag} запущен"
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: mobile/android
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb logcat -G 32M
            adb logcat -c
            bash ./update-over-test.sh
            bash ./run-instrumented.sh || echo failed > instrumented-failed.txt
            adb logcat -d -v time > logcat.txt
            adb shell dumpsys activity services org.peregovorka.android > services.txt || true
            test ! -f instrumented-failed.txt
      - name: Отчёты и журнал устройства
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-api${{ matrix.api }}
          path: |
            mobile/android/logcat.txt
            mobile/android/services.txt
            mobile/android/app/build/reports/androidTests
            mobile/android/app/build/outputs/androidTest-results
            mobile/android/app/build/join-attempts
            livekit.log
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: [build, emulator]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with: { name: android-build, path: out }
      - name: Выпуск
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#android-v}"
          pre=""; ls out | grep -q debugkey && pre="--prerelease"
          awk -v v="$v" '/^## /{p=($0 ~ "^## \\[?"v)} p' mobile/android/CHANGELOG.md > notes.md
          [ -f out/UPDATE_NOTE.md ] && { cat out/UPDATE_NOTE.md; echo; cat notes.md; } > notes2.md && mv notes2.md notes.md; rm -f out/UPDATE_NOTE.md
          [ -s notes.md ] || echo "Peregovorka для Android $v" > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else gh release create "$GITHUB_REF_NAME" out/* --title "Peregovorka для Android $v" --notes-file notes.md --latest=false $pre --verify-tag; fi
