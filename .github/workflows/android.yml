name: Android
# Приложение Peregovorka для Android (mobile/android/): проверки, сборка APK/AAB, испытание на эмуляторе, выпуск по тегу android-vX.Y.Z.
# Серверные теги vX.Y.Z и канал обновления сервера не затрагиваются.
# Подпись: секреты ANDROID_KEYSTORE_B64 (base64 .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
#   • без них APK подписан отладочным ключом — годится для проверки, но не для постоянной установки (каждая сборка с другим ключом);
#   • с ними — один и тот же ключ из выпуска в выпуск: обновление ставится поверх. Ключ в репозиторий не попадает (docs/ANDROID_BUILD.md).
on:
  push:
    branches: [main, "feat/**"]
    tags: ["android-v[0-9]+.[0-9]+.[0-9]+"]
    paths: ["mobile/android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["mobile/android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: mobile/android } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Ключ подписи (если задан)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PEREGOVORKA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "SIGNED=debug-key" >> "$GITHUB_ENV"
          fi
      - name: Модульные тесты и линт
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Сборка APK и AAB
        env:
          PEREGOVORKA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PEREGOVORKA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PEREGOVORKA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
          if [ "$SIGNED" = release ]; then ./gradlew --no-daemon :app:bundleRelease; fi
      - name: Проверка подписи и состава
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3
          "$BT/aapt2" dump badging app/build/outputs/apk/release/app-release.apk | grep -E "^package|uses-permission" | head -20
      - name: Именование и контрольные суммы
        run: |
          V=$(cat VERSION); mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Peregovorka-$V-android.apk"
          if [ "$SIGNED" != release ]; then mv "out/Peregovorka-$V-android.apk" "out/Peregovorka-$V-android-debugkey.apk"; fi
          [ -f app/build/outputs/bundle/release/app-release.aab ] && cp app/build/outputs/bundle/release/app-release.aab "out/Peregovorka-$V-android.aab" || true
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with: { name: android-build, path: mobile/android/out/*, retention-days: 30 }
      - uses: actions/upload-artifact@v7
        with:
          name: android-test-apks
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 3

  emulator:
    # Настоящий Android (эмулятор с KVM): Keystore, холодный запуск интерфейса. Звонок с камерой и микрофоном на реальном устройстве здесь не проверяется.
    runs-on: ubuntu-24.04
    needs: build
    defaults: { run: { working-directory: mobile/android } }
    steps:
      - uses: actions/checkout@v7
      - name: KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: mobile/android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: [build, emulator]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with: { name: android-build, path: out }
      - name: Выпуск
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#android-v}"
          pre=""; ls out | grep -q debugkey && pre="--prerelease"
          awk -v v="$v" '/^## /{p=($0 ~ "^## \\[?"v)} p' mobile/android/CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Peregovorka для Android $v" > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else gh release create "$GITHUB_REF_NAME" out/* --title "Peregovorka для Android $v" --notes-file notes.md --latest=false $pre --verify-tag; fi
