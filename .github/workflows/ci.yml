name: CI
on:
  # Изменения только клиента Windows проверяет свой workflow (desktop.yml); теги выпуска сервера — всегда полный CI (фильтр путей к тегам не применяется).
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
    paths-ignore: ["desktop/**", "mobile/**", ".github/workflows/desktop.yml", ".github/workflows/android.yml", "docs/DESKTOP*.md", "tests/live/desktop_*.py", ".claude/**"]
  pull_request:
    paths-ignore: ["desktop/**", "mobile/**", ".github/workflows/desktop.yml", ".github/workflows/android.yml", "docs/DESKTOP*.md", "tests/live/desktop_*.py", ".claude/**"]

jobs:
  deps:
    # Ревизия сторонних компонентов (docs/DEPENDENCIES.md): закрепления в файлах = манифест релиза, у каждой отсрочки есть причина, задача и непросроченная дата.
    # Для тега релиза дополнительно по сети: нет вышедших версий без решения и нет известных уязвимостей без записи (OSV).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/deps.py verify
      - name: Новые версии и уязвимости (только для тега релиза)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/deps.py verify --online --release "${GITHUB_REF_NAME#v}"

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends ffmpeg fonts-dejavu-core libkrb5-dev gcc
      # те же точные версии, что в образе (constraints.txt): CI проверяет выпускаемый комплект, а не «самые новые в диапазоне»
      - run: pip install -r backend/requirements-dev.txt -c backend/constraints.txt
      - run: pytest -q --junitxml=junit.xml
        working-directory: backend
      # при падении тестов их имена и первая строка ошибки выводятся аннотациями (видны и через API, без доступа к журналу задания)
      - if: failure()
        working-directory: backend
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          try:
              for tc in ET.parse("junit.xml").getroot().iter("testcase"):
                  for k in ("failure", "error"):
                      for f in tc.findall(k):
                          msg = " ".join((f.get("message") or "").split())[:300]
                          print(f"::error title=pytest {tc.get('classname')}.{tc.get('name')}::{msg}")
          except Exception as exc:
              print(f"::warning::не удалось разобрать junit.xml: {exc}")
          PY

  asr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      # torch/GigaAM в тестах не нужны: используются подставные провайдер и VAD
      - run: pip install -c asr-service/constraints.txt "numpy>=2,<3" redis fastapi uvicorn pydantic pydantic-settings pytest pytest-asyncio fakeredis httpx
      - run: pytest -q
        working-directory: asr-service

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      # Типы проверяются раздельно: production-конфигурация (tsconfig.json) не включает *.test.ts и не знает Node, тесты — свой tsconfig.test.json.
      - run: npm run typecheck:tests && npm test && npm run build
        working-directory: frontend

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Синтаксис всех скриптов (bash -n)
        run: |
          rc=0
          for f in scripts/*.sh scripts/lib/*.sh tests/scripts/*.sh; do
            if ! out="$(bash -n "$f" 2>&1)"; then echo "::error file=$f,title=синтаксис bash::${out//$'\n'/ | }"; rc=1; fi
          done
          exit $rc
      - run: bash tests/scripts/run.sh
      - run: sudo apt-get install -y shellcheck && shellcheck -S warning scripts/*.sh scripts/lib/*.sh || true
      - name: compose config
        run: |
          cp .env.example .env
          mkdir -p /tmp/vm-ca && touch /tmp/vm-ca/ad-ca.pem
          sed -i 's#^LDAP_CA_FILE=.*#LDAP_CA_FILE=/tmp/vm-ca/ad-ca.pem#; s#^DATA_ROOT=.*#DATA_ROOT=/tmp/vm-data#' .env
          docker compose -p ci --project-directory deployment --env-file .env -f deployment/compose.yml config -q

  private-data:
    # Проект публичный: частная конфигурация конкретного сервера (домены, хосты, адреса, e-mail, IP) в репозиторий попадать не должна.
    # Проверка по списку РАЗРЕШЁННОГО (scripts/private-data.allow); свои запрещённые шаблоны — вне git (PRIVATE_DENY_FILE).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_private_data.py

  wiki:
    # Исходники вики (wiki/): ссылки между страницами, шапка и блок «Что дальше», страницы в боковой панели, нет секретов и чужих доменов. Предупреждения о версии не блокируют.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_wiki.py

  version:
    # Версия задаётся одним файлом VERSION; CHANGELOG и frontend/package.json обязаны с ней совпадать, а тег (если это сборка тега) — быть vVERSION.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - run: ./scripts/release.sh check
      - name: Тег совпадает с VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME}" = "v$(tr -d '[:space:]' < VERSION)"
      - name: Напоминание о новой версии
        if: github.ref == 'refs/heads/main'
        run: |
          last="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)"
          if [ -n "$last" ] && [ "$last" = "v$(tr -d '[:space:]' < VERSION)" ] && [ "$(git rev-list --count "$last..HEAD")" -gt 0 ]; then
            echo "::notice::После тега $last есть новые коммиты без новой версии. Перед выпуском: ./scripts/release.sh patch"
          fi

  web-image:
    # Настоящая сборка образа web (стадия draw.io, SPA, nginx) и проверка на живом nginx: nginx -t и запросы «как через внешний прокси» (X-Forwarded-Proto: https).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/nginx/run.sh
      - name: Сборка web так же, как при обновлении (compose build, прежний сборщик, те же аргументы)
        run: |
          cp .env.example .env
          mkdir -p /tmp/vm-ca && touch /tmp/vm-ca/ad-ca.pem
          sed -i 's#^LDAP_CA_FILE=.*#LDAP_CA_FILE=/tmp/vm-ca/ad-ca.pem#; s#^DATA_ROOT=.*#DATA_ROOT=/tmp/vm-data#' .env
          DOCKER_BUILDKIT=0 COMPOSE_DOCKER_CLI_BUILD=0 APP_VERSION="$(cat VERSION)" APP_GIT_COMMIT="${GITHUB_SHA::7}" APP_BUILT_AT="$(date -u +%FT%TZ)"             docker compose -p ci --project-directory deployment --env-file .env -f deployment/compose.yml build web

  asr-image:
    # Регрессия 0.24.1 (нет onnxruntime → Silero VAD не создавался, а ASR оставался «здоровым»): образ собирается как при обновлении; сборка падает на `pip check`
    # и на неудачной инициализации VAD (RUN python -m app.selfcheck в Dockerfile). Здесь же проверяем, что самопроверка готового образа проходит.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Сборка ASR (с pip check и проверкой Silero VAD)
        run: |
          sha="$(grep '^GIGAAM_GIT_COMMIT=' .env.example | cut -d= -f2)"
          docker build --build-arg GIGAAM_GIT_COMMIT="$sha" -t asr-ci asr-service
      - name: Самопроверка готового образа
        run: docker run --rm asr-ci python -m app.selfcheck

  outlook-scripts:
    # Сценарии PowerShell для Exchange: разбор настоящим парсером PowerShell и прогон (установка, повтор, обновление, удаление, -WhatIf) на подставном Exchange.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends libkrb5-dev gcc      # gssapi и krb5 собираются из исходников
      - run: pip install -r backend/requirements.txt -c backend/constraints.txt
      - run: bash tests/ps/run.sh python3

  perf-smoke:
    # Регрессионная проверка производительности и соединений PostgreSQL на НАСТОЯЩИХ PostgreSQL и Redis: смешанная нагрузка + одновременное формирование протоколов и карт
    # (модель отвечает с задержкой). Падает при росте доли 5xx или при «idle in transaction» дольше порога — то есть если код снова удержит соединение во время долгой операции.
    # Полные испытания на 100/500/1000/2000 пользователей — tests/perf/run_matrix.sh (docs/PERFORMANCE.md).
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: pg }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends libkrb5-dev gcc
      - run: pip install -r backend/requirements-dev.txt -c backend/constraints.txt psutil aiohttp
      - name: Сервер и нагрузка
        env:
          PG_URL: postgresql+asyncpg://postgres:pw@127.0.0.1:5432/pg
          REDIS_URL: redis://127.0.0.1:6379/0
          USERS: "160"
          PORT: "18080"
          LLM_DELAY: "3"
        run: |
          python tests/perf/devserver_perf.py > server.log 2>&1 &
          for i in $(seq 1 90); do curl -fs localhost:18080/api/v1/health/db >/dev/null 2>&1 && break; sleep 1; done
          rc=0
          python tests/perf/race_join.py http://127.0.0.1:18080 30 > race.out 2>&1 || { rc=1; echo "::error title=race_join::$(tail -c 500 race.out | tr '\n' ' ')"; }
          python tests/perf/loadtest.py --users 60 --duration 25 --heavy 6 --pg postgresql://postgres:pw@127.0.0.1:5432/pg --max-5xx-pct 1.0 --max-idle-tx-s 10 --out perf.json > load.out 2>&1 || { rc=1; echo "::error title=loadtest::$(tail -c 900 load.out | tr '\n' ' ')"; }
          [ $rc = 0 ] || echo "::error title=server.log::$(grep -c Traceback server.log) трассировок; первая: $(grep -m1 -A40 Traceback server.log | grep -E '^  File|Error|error' | tail -6 | tr '\n' ' ' | cut -c1-900); ошибки: $(grep -o '"msg": "[^"]*"' server.log | sort | uniq -c | sort -rn | head -5 | tr '\n' ' ')"
          exit $rc
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: perf-smoke, path: "perf.json\nserver.log" }

  clean-os:
    # «С чистой ОС»: в чистом контейнере Ubuntu/Debian нет ни Docker, ни nginx, ни git. Автоматическая установка зависимостей (манифест scripts/lib/prereqlib.sh)
    # должна поставить Docker Engine + Compose + Buildx, nginx, git, curl, openssl и утилиты, а повторный запуск — ничего не ломать.
    # Проверяется стадия prerequisites и план установки (dry-run). Полная сборка образов и запуск сервисов требуют настоящего Docker-демона и ВМ — здесь не проверяются.
    name: clean-os (${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:22.04", "debian:12", "debian:13"]
    container: ${{ matrix.image }}
    steps:
      - name: Система чистая
        run: |
          for c in docker nginx git; do if command -v "$c" >/dev/null 2>&1; then echo "::error::$c уже есть в чистом образе"; exit 1; fi; done
          cat /etc/os-release | head -3
      - uses: actions/checkout@v7
      - name: Установка зависимостей (как в install.sh)
        run: bash scripts/prereq.sh --install --profile standalone
      - name: Всё установлено
        run: |
          docker --version; docker compose version; docker buildx version
          nginx -v; git --version; curl --version | head -1; openssl version
          bash scripts/prereq.sh --check --profile standalone
      - name: Повторный запуск безопасен
        run: bash scripts/prereq.sh --install --profile standalone
      - name: План установки (dry-run) на чистой системе
        run: |
          export PEREGOVORKA_TEST_NO_ROOT_CHECK=1
          fail() { echo "::error title=dry-run::$(tail -n 12 /tmp/dry.out | tr '\n' '|' | cut -c1-900)"; exit 1; }
          ENV_FILE=/tmp/clean.env bash scripts/setup.sh --auto --env-only --host 192.0.2.10 --https-port 8443 --data /tmp/pg-data --skip-models > /tmp/dry.out 2>&1 || fail
          ENV_FILE=/tmp/clean.env bash scripts/install.sh --profile standalone --dry-run --skip-preflight --skip-models > /tmp/dry.out 2>&1 || fail
          cat /tmp/dry.out
          grep -q "Dry-run завершён" /tmp/dry.out
