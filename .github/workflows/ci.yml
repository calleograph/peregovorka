name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -q
        working-directory: backend

  asr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # torch/GigaAM в тестах не нужны: используются подставные провайдер и VAD
      - run: pip install "numpy>=2,<3" redis fastapi uvicorn pydantic pydantic-settings pytest pytest-asyncio fakeredis httpx
      - run: pytest -q
        working-directory: asr-service

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: for f in scripts/*.sh scripts/lib/*.sh tests/scripts/*.sh; do bash -n "$f"; done
      - run: bash tests/scripts/run.sh
      - run: sudo apt-get install -y shellcheck && shellcheck -S warning scripts/*.sh scripts/lib/*.sh || true
      - name: compose config
        run: |
          cp .env.example .env
          mkdir -p /tmp/vm-ca && touch /tmp/vm-ca/ad-ca.pem
          sed -i 's#^LDAP_CA_FILE=.*#LDAP_CA_FILE=/tmp/vm-ca/ad-ca.pem#; s#^DATA_ROOT=.*#DATA_ROOT=/tmp/vm-data#' .env
          docker compose -p ci --project-directory deployment --env-file .env -f deployment/compose.yml config -q

  version:
    # Версия задаётся одним файлом VERSION; CHANGELOG и frontend/package.json обязаны с ней совпадать, а тег (если это сборка тега) — быть vVERSION.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: ./scripts/release.sh check
      - name: Тег совпадает с VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME}" = "v$(tr -d '[:space:]' < VERSION)"
      - name: Напоминание о новой версии
        if: github.ref == 'refs/heads/main'
        run: |
          last="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)"
          if [ -n "$last" ] && [ "$last" = "v$(tr -d '[:space:]' < VERSION)" ] && [ "$(git rev-list --count "$last..HEAD")" -gt 0 ]; then
            echo "::notice::После тега $last есть новые коммиты без новой версии. Перед выпуском: ./scripts/release.sh patch"
          fi

  web-image:
    # Настоящая сборка образа web (стадия draw.io, SPA, nginx) и проверка на живом nginx: nginx -t и запросы «как через внешний прокси» (X-Forwarded-Proto: https).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/nginx/run.sh

  clean-os:
    # «С чистой ОС»: в чистом контейнере Ubuntu/Debian нет ни Docker, ни nginx, ни git. Автоматическая установка зависимостей (манифест scripts/lib/prereqlib.sh)
    # должна поставить Docker Engine + Compose + Buildx, nginx, git, curl, openssl и утилиты, а повторный запуск — ничего не ломать.
    # Проверяется стадия prerequisites и план установки (dry-run). Полная сборка образов и запуск сервисов требуют настоящего Docker-демона и ВМ — здесь не проверяются.
    name: clean-os (${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:22.04", "debian:12", "debian:13"]
    container: ${{ matrix.image }}
    steps:
      - name: Система чистая
        run: |
          for c in docker nginx git; do if command -v "$c" >/dev/null 2>&1; then echo "::error::$c уже есть в чистом образе"; exit 1; fi; done
          cat /etc/os-release | head -3
      - uses: actions/checkout@v4
      - name: Установка зависимостей (как в install.sh)
        run: bash scripts/prereq.sh --install --profile standalone
      - name: Всё установлено
        run: |
          docker --version; docker compose version; docker buildx version
          nginx -v; git --version; curl --version | head -1; openssl version
          bash scripts/prereq.sh --check --profile standalone
      - name: Повторный запуск безопасен
        run: bash scripts/prereq.sh --install --profile standalone
      - name: План установки (dry-run) на чистой системе
        run: |
          export PEREGOVORKA_TEST_NO_ROOT_CHECK=1
          ENV_FILE=/tmp/clean.env bash scripts/setup.sh --auto --env-only --host 192.0.2.10 --https-port 8443 --data /tmp/pg-data --skip-models
          ENV_FILE=/tmp/clean.env bash scripts/install.sh --profile standalone --dry-run --skip-preflight --skip-models 2>&1 | tee /tmp/dry.out
          grep -q "Dry-run завершён" /tmp/dry.out
