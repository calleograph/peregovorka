org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9.x по умолчанию включает модульные тесты только для тестируемого типа сборки (debug), а задача Compose Preview регистрируется и для release и требует тесты;
# без этого `gradlew tasks --all` и импорт в VS Code падают на release. CI вызывает конкретные задачи (testDebugUnitTest), общий `test` не используется.
android.onlyEnableUnitTestForTheTestedBuildType=false
