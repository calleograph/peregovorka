# Контейнер web: статика SPA + прокси к backend и livekit внутри docker-сети проекта.
# DNS-имена backend/livekit резолвятся динамически (resolver Docker), чтобы после
# пересоздания контейнера nginx не держал устаревший IP.

# Реальная схема публичного URL: значение от внешнего прокси сохраняется как есть (https не превращается в http);
# если прокси его не передал — берём схему этого соединения.
map $http_x_forwarded_proto $xfp {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Кэширование HLS: плейлист живой (CDN держит его не дольше секунды), сегменты уникальны и не меняются.
map $uri $hls_cache_control {
    "~[.]m3u8$" "public, max-age=1";
    default   "public, max-age=300, immutable";
}

# Секрет подписи HLS: по умолчанию пуст (тогда раздача закрыта целиком); настоящий лежит в /etc/nginx/live/secret.conf — файл пишет backend в том трансляций.
map $uri $hls_secret_default { default ""; }

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server_tokens off;
    client_max_body_size 100m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "microphone=(self), camera=(self), display-capture=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Сведения о сборке (commit/время) — для scripts/verify.sh; не кэшируется.
    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /version.json =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Внутренние эндпоинты наружу не отдаются никогда.
    location /internal/ { return 404; }

    location /api/v1/ws {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-PG-Peer $remote_addr;           # с какого адреса подключились к этому web (клиент или внешний прокси); заголовок всегда перезаписывается — подделать снаружи нельзя
        proxy_set_header X-Forwarded-Proto $xfp;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # realtime: без буферизации и с отключённым алгоритмом Нейгла — задержка сигналинга/событий минимальна (у Jitsi тот же tcp_nodelay на WebSocket)
        proxy_buffering off;
        proxy_request_buffering off;
        tcp_nodelay on;
    }

    # Резервная копия конфигурации: архив зашифрован, но всё равно не должен оседать во временных файлах прокси — без буферизации запроса и ответа; размер ограничен приложением (64 МиБ).
    # Пароли архива и администратора идут заголовками: в журнал доступа nginx они не попадают (журнал пишет только строку запроса).
    location /api/v1/admin/config/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-PG-Peer $remote_addr;           # с какого адреса подключились к этому web (клиент или внешний прокси); заголовок всегда перезаписывается — подделать снаружи нельзя
        proxy_set_header X-Forwarded-Proto $xfp;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_read_timeout 120s;
        client_max_body_size 64m;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Выгрузка протокола в HTML для просмотра и печати в браузере (?inline=true): у страницы своя строгая политика безопасности (заголовок backend: нет сети, sandbox, хеш собственного
    # скрипта). Общая политика приложения (style-src 'self') её бы ломала, а директивы add_header уровня location заменяют серверные — поэтому остальные заголовки безопасности повторены.
    location ~ ^/api/v1/meetings/[0-9a-f-]+/protocols/[0-9a-f-]+/export$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-PG-Peer $remote_addr;
        proxy_set_header X-Forwarded-Proto $xfp;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_read_timeout 120s;
    }

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-PG-Peer $remote_addr;           # с какого адреса подключились к этому web (клиент или внешний прокси); заголовок всегда перезаписывается — подделать снаружи нельзя
        proxy_set_header X-Forwarded-Proto $xfp;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_read_timeout 120s;
    }

    # Сигналинг LiveKit (WebSocket). Медиа идёт напрямую на ICE-порты хоста, не через этот прокси.
    location /livekit/ {
        set $livekit http://livekit:7880;
        rewrite ^/livekit/(.*)$ /$1 break;
        proxy_pass $livekit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-PG-Peer $remote_addr;           # с какого адреса подключились к этому web (клиент или внешний прокси); заголовок всегда перезаписывается — подделать снаружи нельзя
        proxy_set_header X-Forwarded-Proto $xfp;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # realtime: без буферизации и с отключённым алгоритмом Нейгла — задержка сигналинга/событий минимальна (у Jitsi тот же tcp_nodelay на WebSocket)
        proxy_buffering off;
        proxy_request_buffering off;
        tcp_nodelay on;
    }

    # Редактор схем draw.io (статика, развёрнута в этом же контейнере). Страница встречи встраивает его iframe'ом с sandbox БЕЗ allow-same-origin
    # (у фрейма «непрозрачное» происхождение — он не получает ни cookie, ни доступа к API приложения), поэтому нужен CORS «*» для его
    # собственных файлов; из-за add_header (директивы на уровне location заменяют серверные) заголовки безопасности повторены здесь.
    # draw.io использует inline-скрипты и eval — это разрешено ТОЛЬКО в этом location; наружу фрейм ничего не отправляет (connect-src 'self').
    location /drawio/ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Permissions-Policy "microphone=(), camera=(), display-capture=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'" always;
        try_files $uri =404;
    }

    # Надстройка Outlook (Office.js): страницы команды и окна входа загружаются Outlook'ом и подключают Office.js и MicrosoftAjax.js с этого же сервера (/outlook/assets/, кладутся в образ при сборке: frontend/scripts/vendor-officejs.mjs);
    # CDN Microsoft разрешён для запасного пути, если локальной копии нет. Поэтому здесь свой CSP: скрипты — наши и Microsoft, соединения — только с этим сервером. Встраивание разрешено (Outlook открывает страницу во фрейме/WebView);
    # у страниц нет разметки, которой можно подсунуть клик, а действия выполняются токеном надстройки в её собственном контексте.
    # Публичный центр установки надстройки: /outlook и /outlook/ отдают приложение (страница без входа) БЕЗ перенаправлений; файлы надстройки — в /outlook/*.
    location = /outlook/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files /index.html =404;
    }

    location /outlook/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-UA-Compatible "IE=edge" always;     # классический Outlook (IE 11): без режима совместимости, иначе Office.js не запускается
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://officeapis.public.onecdn.static.microsoft https://appsforoffice.microsoft.com https://*.cdn.office.net; style-src 'self'; img-src 'self' data:; connect-src 'self' https://officeapis.public.onecdn.static.microsoft https://appsforoffice.microsoft.com https://*.cdn.office.net; frame-src 'self' https://officeapis.public.onecdn.static.microsoft https://appsforoffice.microsoft.com https://*.cdn.office.net; frame-ancestors *; base-uri 'none'; form-action 'none'; object-src 'none'" always;
        try_files $uri =404;
    }

    # Просмотр «Карты разговора» (статика этого же контейнера). Страница встречи встраивает его iframe'ом с sandbox="allow-scripts" БЕЗ allow-same-origin:
    # у окна «непрозрачное» происхождение — ни cookie, ни доступа к API; данные приходят через postMessage. Скрипт и стили — только свои файлы (inline нет).
    location /mapview/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Permissions-Policy "microphone=(), camera=(), display-capture=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
        try_files $uri =404;
    }

    # Прямой эфир (HLS). Адрес: /hls/<идентификатор доступа>/<срок>/<подпись>/index.m3u8 и seg_N.ts. Подпись (MD5 от срока, идентификатора и секрета) проверяет сам nginx
    # (secure_link), backend в раздаче не участвует: зрителей можно считать сотнями без нагрузки на приложение. Идентификатор доступа — имя ссылки в /live/acc на каталог эфира;
    # владелец отозвал ссылку или сменил пароль — ссылка удалена, и старые адреса перестают открываться сразу. Отдаются только плейлист index.m3u8 и сегменты seg_N.ts.
    location ~ "^/hls/(?<acc>[0-9a-f]{24})/(?<exp>[0-9]{9,11})/(?<sig>[A-Za-z0-9_-]{22})/(?<rest>index[.]m3u8|seg_[0-9]+[.]ts)$" {
        set $hls_secret $hls_secret_default;
        include /etc/nginx/live/*.conf;
        if ($hls_secret = "") { return 503; }                 # секрета нет — раздача закрыта (без него подпись подделывается)
        secure_link $sig,$exp;
        secure_link_md5 "$exp$acc $hls_secret";
        if ($secure_link = "") { return 403; }                # подпись не сошлась
        if ($secure_link = "0") { return 410; }               # срок подписи вышел: плеер запросит новую у приложения
        alias /live/acc/$acc/$rest;
        access_log off;                                       # в пути лежит подпись; журнал с миллионами строк сегментов не нужен
        add_header Cache-Control $hls_cache_control always;
        add_header Access-Control-Allow-Origin "*" always;    # ссылку на поток открывают внешние плееры; доступ определяет подпись
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    location /hls/ { return 404; }

    # Шрифты интерфейса (имена файлов без хэша, меняются крайне редко): неделя кэша браузера вместо проверки при каждом заходе. Заголовки безопасности повторены (location заменяет серверные).
    location /fonts/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri =404;
    }

    # Значки сайта и манифест: сутки кэша (имена без хэша, меняются редко); заголовки безопасности повторены.
    location ~* ^/(favicon.*\.(svg|ico|png)|apple-touch-icon\.png|icon-.*\.png|manifest\.webmanifest|robots\.txt)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        types { image/svg+xml svg; image/x-icon ico; image/png png; application/manifest+json webmanifest; text/plain txt; }
        try_files $uri =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Permissions-Policy "microphone=(self), camera=(self), display-capture=(self), geolocation=()" always;
        try_files $uri /index.html;
    }
}
