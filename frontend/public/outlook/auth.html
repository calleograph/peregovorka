<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <!-- Классический Outlook 2016/2019 показывает надстройку в Internet Explorer 11; сайт во внутренней сети IE открыл бы в режиме совместимости (IE7),
       где Office.js не запускается («Ошибка надстройки»). Сервер дополнительно отдаёт заголовок X-UA-Compatible. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peregovorka — вход для Outlook</title>
  <link rel="stylesheet" href="/outlook/outlook.css">
  <script src="/outlook/boot.js"></script>
  <script src="/outlook/polyfill.js"></script>
  <script src="/outlook/ms-loader.js"></script>
  <script src="/outlook/auth.js" defer></script>
</head>
<body>
  <main class="auth" id="auth">
    <div class="auth-box">
      <img src="/outlook/icon-64.png" width="48" height="48" alt="">
      <h1>Peregovorka</h1>
      <span class="spinner" aria-hidden="true"></span>
      <p id="status" role="status">Проверяем вход…</p>
      <!-- вход логином и паролем прямо в окне: работает и во встроенном IE 11 классического Outlook, где основное приложение не открывается -->
      <form id="form" class="auth-form" hidden>
        <label for="login">Логин</label>
        <input id="login" name="login" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="submit" class="btn primary" type="submit">Войти</button>
      </form>
    </div>
  </main>
</body>
</html>
