# Зеркала Docker Hub: пробуются по порядку, если Docker Hub не отдал образ после нескольких попыток (scripts/lib/imglib.sh).
# Образ берётся только по дайджесту, закреплённому в выпуске: зеркало не может подменить версию, иначе загрузка отклоняется.
# Формат: по строке на источник; «хост[/префикс]» — зеркало Docker Hub, «реестр=хост[/префикс]» — зеркало другого реестра.
# Переопределение на сервере: IMAGE_MIRRORS в .env (через пробел; «none» — без зеркал).
# На стенде владельца BuildKit скачал слои Python по закреплённому дайджесту из обоих источников.
# GitVerse исключён из-за HTTP 500 на слоях. У Yandex для проверенного образа HTTP 404.
mirror.gcr.io
dockerhub.timeweb.cloud
