# Compose-описание ОДНОГО экземпляра системы.
#
# Запускать только через scripts/*.sh (они задают --project-directory, --env-file
# и -p ${COMPOSE_PROJECT_NAME}). Имена контейнеров, сетей и volumes НЕ
# фиксируются: compose строит их из COMPOSE_PROJECT_NAME, поэтому два экземпляра
# и чужие проекты на одном хосте не конфликтуют.
#
# Порты хоста — только из переменных БЕЗ значений по умолчанию (${VAR:?...}):
# незаполненная переменная = отказ запуска, а не молчаливый захват порта.
# PostgreSQL и Redis не публикуются.

name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env: &app-env
  # APP_VERSION/APP_GIT_COMMIT/APP_BUILT_AT намеренно НЕ передаются при запуске: они запечены в образ при сборке
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:?}
  POSTGRES_USER: ${POSTGRES_USER:?}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?}
  LIVEKIT_INTERNAL_URL: ws://livekit:7880
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}

services:
  postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    # Предел соединений и контрольные таймауты: пулы приложения масштабируются по ядрам (backend/app/db.py), PostgreSQL должен вмещать пулы ВСЕХ процессов backend
    # (число процессов × (пул запросов + пул фоновых задач) + служебные). Значение задаётся в .env (POSTGRES_MAX_CONNECTIONS); при смене перезапустите postgres.
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-300}", "-c", "idle_in_transaction_session_timeout=${POSTGRES_IDLE_IN_TX_MS:-0}"]
    volumes:
      - ${DATA_ROOT:?DATA_ROOT is required}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  redis:
    image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true      # процесс в контейнере не может получить больше прав (setuid и т. п.); на работу сервиса не влияет
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes", "--save", "60", "1000"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - ${DATA_ROOT}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  livekit:
    build:
      context: ./livekit
      network: ${BUILD_NETWORK:-default}   # сеть шагов RUN при сборке; host — если источники доступны только из сети хоста (scripts/lib/netcheck.sh)
      args:
        LIVEKIT_IMAGE_TAG: ${LIVEKIT_IMAGE_TAG:?}
    image: ${COMPOSE_PROJECT_NAME}-livekit:${LIVEKIT_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy       # нужен, когда включена SIP-телефония (общая шина LiveKit ↔ SIP)
    # Внутренние порты ICE равны опубликованным: LiveKit сообщает клиентам
    # именно эти значения в ICE-кандидатах, расхождение ломает подключение.
    # Адреса ICE (режим LIVEKIT_MEDIA_MODE и LIVEKIT_RTC_*) вычисляет scripts/medianet.py при установке и обновлении; без них —
    # прежнее поведение (объявляется LIVEKIT_NODE_IP). NET_ADMIN — только чтобы entrypoint добавил адрес локальной сети на интерфейс
    # контейнера (сервер за NAT: клиенты офиса получают его вместе с публичным), см. deployment/livekit/entrypoint.sh.
    cap_add: [NET_ADMIN]
    init: true                           # entrypoint следит за сменой публичного адреса фоновым процессом — init передаёт сигналы и убирает зомби
    ports:
      - "127.0.0.1:${LIVEKIT_HTTP_PORT:?}:7880/tcp"
      - "${LIVEKIT_BIND_ADDR:?}:${LIVEKIT_TCP_PORT:?}:${LIVEKIT_TCP_PORT}/tcp"
      - "${LIVEKIT_BIND_ADDR}:${LIVEKIT_UDP_PORT:?}:${LIVEKIT_UDP_PORT}/udp"
    environment:
      LIVEKIT_LAN_IP: ${LIVEKIT_RTC_LAN_IP:-}
      LIVEKIT_IP_RECHECK: ${LIVEKIT_IP_RECHECK:-300}
      LIVEKIT_STUN_SERVERS: ${LIVEKIT_STUN_SERVERS:-stun.cloudflare.com:3478,global.stun.twilio.com:3478,stun.l.google.com:19302}
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        # Метрики для «Администрирование → Производительность» (трафик, число потоков). Порт слушает только внутри сети проекта и наружу не публикуется.
        prometheus_port: 6789
        rtc:
          tcp_port: ${LIVEKIT_TCP_PORT}
          udp_port: ${LIVEKIT_UDP_PORT}
          use_external_ip: ${LIVEKIT_RTC_USE_EXTERNAL_IP:-false}
          advertise_internal_ip: ${LIVEKIT_RTC_ADVERTISE_INTERNAL:-false}
          node_ip: ${LIVEKIT_RTC_NODE_IP:-${LIVEKIT_NODE_IP:?}}
          stun_servers: [${LIVEKIT_STUN_SERVERS:-stun.cloudflare.com:3478,global.stun.twilio.com:3478,stun.l.google.com:19302}]
        ${LIVEKIT_REDIS_LINE:-}
        room:
          # Не закрывать комнату мгновенно: обновление страницы и краткий обрыв сети не должны её удалять.
          departure_timeout: ${LIVEKIT_ROOM_DEPARTURE_TIMEOUT:-60}
          empty_timeout: ${LIVEKIT_ROOM_EMPTY_TIMEOUT:-300}
        keys:
          ${LIVEKIT_API_KEY:?}: ${LIVEKIT_API_SECRET:?}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://backend:8000/internal/v1/livekit/webhook
    # Приоритет звонка при нехватке процессора: вес (не лимит!) выше обычного — при свободном процессоре ничего не меняется, а при конкуренции с распознаванием
    # речи и языковой моделью LiveKit получает долю в первую очередь. Много открытых соединений зрителей: запас дескрипторов файлов.
    cpu_shares: 8192            # наравне с Egress: идущие разговоры не уступают эфиру процессор
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7880/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  backend:
    build:
      context: ../backend
      network: ${BUILD_NETWORK:-default}   # сеть шагов RUN при сборке; host — если источники доступны только из сети хоста (scripts/lib/netcheck.sh)
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
        APP_GIT_COMMIT: ${APP_GIT_COMMIT:-unknown}
        APP_BUILT_AT: ${APP_BUILT_AT:-unknown}
    image: ${COMPOSE_PROJECT_NAME}-backend:${IMAGE_TAG:?}
    restart: unless-stopped
    group_add: ["10001"]              # общая с web группа: секрет подписи HLS backend создаёт с группой 10001 и правами 0640 (читает только nginx)
    security_opt:
      - no-new-privileges:true      # процесс в контейнере не может получить больше прав (setuid и т. п.); на работу сервиса не влияет
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    environment:
      <<: *app-env
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?}
      APP_MASTER_KEY: ${APP_MASTER_KEY:?}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:?}
      LIVEKIT_TOKEN_TTL_SECONDS: ${LIVEKIT_TOKEN_TTL_SECONDS:-300}
      LIVEKIT_SERVER_VERSION: ${LIVEKIT_IMAGE_TAG:-unknown}
      ASR_INTERNAL_URL: http://asr:8090
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:-}
      LIVEKIT_PUBLIC_IP: ${LIVEKIT_PUBLIC_IP:-auto}
      LIVEKIT_STUN_SERVERS: ${LIVEKIT_STUN_SERVERS:-stun.cloudflare.com:3478,global.stun.twilio.com:3478,stun.l.google.com:19302}
      LIVEKIT_MEDIA_MODE: ${LIVEKIT_MEDIA_MODE:-}
      LIVEKIT_RTC_NODE_IP: ${LIVEKIT_RTC_NODE_IP:-}
      LIVEKIT_RTC_USE_EXTERNAL_IP: ${LIVEKIT_RTC_USE_EXTERNAL_IP:-false}
      LIVEKIT_RTC_ADVERTISE_INTERNAL: ${LIVEKIT_RTC_ADVERTISE_INTERNAL:-false}
      LIVEKIT_RTC_LAN_IP: ${LIVEKIT_RTC_LAN_IP:-}
      LIVEKIT_RTC_TCP_PORT: ${LIVEKIT_TCP_PORT:-0}
      LIVEKIT_RTC_UDP_PORT: ${LIVEKIT_UDP_PORT:-0}
      # LDAP_* необязательны: каталог подключается в веб-интерфейсе (Администрирование → LDAP и доступ); эти значения — прежний способ
      LDAP_URIS: ${LDAP_URIS:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_CA_FILE: /run/secrets/ldap-ca.pem
      LDAP_LOGIN_ATTRIBUTE: ${LDAP_LOGIN_ATTRIBUTE:-sAMAccountName}
      LDAP_DISPLAY_NAME_ATTRIBUTE: ${LDAP_DISPLAY_NAME_ATTRIBUTE:-displayName}
      LDAP_ADMIN_GROUP_DN: ${LDAP_ADMIN_GROUP_DN:-}
      LDAP_ACCESS_GROUP_DN: ${LDAP_ACCESS_GROUP_DN:-}
      LDAP_TIMEOUT_SECONDS: ${LDAP_TIMEOUT_SECONDS:-5}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      IP_ACCESS_DISABLE: ${IP_ACCESS_DISABLE:-0}
      TLS_LOCAL_CONFIGURED: ${NGINX_TLS_CERT:+true}
      # Только для раздела «Сетевая доступность»: как установлен экземпляр (адреса привязки и порты на хосте). Секретов здесь нет.
      NET_INSTALL_PROFILE: ${INSTALL_PROFILE:-}
      NET_LIVEKIT_BIND_ADDR: ${LIVEKIT_BIND_ADDR:-0.0.0.0}
      NET_LIVEKIT_HTTP_PORT: ${LIVEKIT_HTTP_PORT:-}
      NET_WEB_BIND_ADDR: ${WEB_BIND_ADDR:-127.0.0.1}
      NET_WEB_PORT: ${WEB_PORT:-}
      NET_NGINX_LISTEN_PORT: ${NGINX_LISTEN_PORT:-}
      NET_SIP_BIND_ADDR: ${SIP_BIND_ADDR:-0.0.0.0}
      # Масштабирование (docs/DB_AND_SCALING.md): число процессов uvicorn и размеры пулов; пусто/0 — по числу ядер. Фоновые задачи выполняет один «ведущий» процесс (Redis).
      UVICORN_WORKERS: ${BACKEND_WORKERS:-1}
      UVICORN_TIMEOUT_WORKER_HEALTHCHECK: "30"      # 5 с по умолчанию: при кратком дефиците процессора здоровый процесс убивался, а вместе с ним соединения его пользователей
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-300}     # пулы всех процессов ужимаются под этот предел (иначе отказы «too many clients»)
      DB_POOL_SIZE: ${DB_POOL_SIZE:-0}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-0}
      DB_BG_POOL_SIZE: ${DB_BG_POOL_SIZE:-0}
      DB_POOL_TIMEOUT_S: ${DB_POOL_TIMEOUT_S:-15}
      DB_IDLE_IN_TX_TIMEOUT_S: ${DB_IDLE_IN_TX_TIMEOUT_S:-120}
      DB_STATEMENT_TIMEOUT_S: ${DB_STATEMENT_TIMEOUT_S:-300}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.0/8,::1/128}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      SESSION_IDLE_TIMEOUT_SECONDS: ${SESSION_IDLE_TIMEOUT_SECONDS:-28800}
      SESSION_ABSOLUTE_TIMEOUT_SECONDS: ${SESSION_ABSOLUTE_TIMEOUT_SECONDS:-86400}
      DEFAULT_TEXT_RETENTION_DAYS: ${DEFAULT_TEXT_RETENTION_DAYS:-365}
      DEFAULT_AUDIO_RETENTION_DAYS: ${DEFAULT_AUDIO_RETENTION_DAYS:-30}
      MEETING_END_GRACE_SECONDS: ${MEETING_END_GRACE_SECONDS:-60}
      HEAVY_CONCURRENCY: ${HEAVY_CONCURRENCY:-2}
      HEAVY_MAX_DEFER_SECONDS: ${HEAVY_MAX_DEFER_SECONDS:-1800}
      LIVEKIT_METRICS_URL: ${LIVEKIT_METRICS_URL:-}
      DATA_DIR: /data
      LIVE_DIR: /data/live
      LIVE_EGRESS_DIR: /live
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      SIP_ENABLED: ${SIP_ENABLED:-no}
      VIDEO_ENABLED: ${VIDEO_ENABLED:-no}
      SIP_SIGNALING_PORT: ${SIP_SIGNALING_PORT:-5060}
      SIP_RTP_START: ${SIP_RTP_START:-20000}
      SIP_RTP_END: ${SIP_RTP_END:-20100}
      SIP_MEDIA_IP: ${SIP_MEDIA_IP:-}
      SIP_ALLOWED_CIDRS: ${SIP_ALLOWED_CIDRS:-}
    networks:
      - default
    volumes:
      # прежний CA-файл (если задан); пусто — /dev/null: CA загружаются в веб-интерфейсе и лежат в /data/ca
      - ${LDAP_CA_FILE:-/dev/null}:/run/secrets/ldap-ca.pem:ro
      - ${DATA_ROOT}/ca:/data/ca
      - ${DATA_ROOT}/chat-files:/data/chat-files
      # фото профилей и изображения оформления («Настройки сайта»): без постоянного тома пропадали бы при пересоздании контейнера
      - ${DATA_ROOT}/avatars:/data/avatars
      - ${DATA_ROOT}/branding:/data/branding
      - ${DATA_ROOT}/exports:/data/exports
      - ${DATA_ROOT}/recordings:/data/recordings
      - ${DATA_ROOT}/live:/data/live            # HLS прямых эфиров (общий с Egress и nginx web)
      # Внешние тома: помощник на хосте подключает смонтированный каталог в ext/ИД, и он сразу виден здесь как /data/ext/ИД, без пересоздания контейнера (scripts/lib/vollib.sh).
      - type: bind
        source: ${DATA_ROOT}/ext
        target: /data/ext
        bind:
          propagation: ${EXT_PROPAGATION:-rslave}
          create_host_path: true
      # счётчики сетевых интерфейсов хоста для диагностики эфира (только чтение, один файл): контейнер видит только свою сеть. Отключается HOST_NETDEV=/dev/null в .env
      - ${HOST_NETDEV:-/proc/1/net/dev}:/host/netdev:ro
      # обмен с исполнителем обновлений на хосте (scripts/updater.sh): запросы из веб-интерфейса и вывод обновления
      - ${DATA_ROOT}/updater:/data/updater
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/db', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    logging: *default-logging

  asr:
    build:
      context: ../asr-service
      network: ${BUILD_NETWORK:-default}   # сеть шагов RUN при сборке; host — если источники доступны только из сети хоста (scripts/lib/netcheck.sh)
      args:
        TORCH_INDEX_URL: ${ASR_TORCH_INDEX_URL:?}
        GIGAAM_GIT_COMMIT: ${GIGAAM_GIT_COMMIT:?}
        APP_VERSION: ${APP_VERSION:-0.0.0}
        APP_GIT_COMMIT: ${APP_GIT_COMMIT:-unknown}
        APP_BUILT_AT: ${APP_BUILT_AT:-unknown}
    image: ${COMPOSE_PROJECT_NAME}-asr:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    environment:
      <<: *app-env
      ASR_PROVIDER: ${ASR_PROVIDER:-gigaam}
      ASR_MODEL_NAME: ${ASR_MODEL_NAME:-v3_e2e_rnnt}
      ASR_MODEL_DIR: /models/gigaam
      ASR_DEVICE: ${ASR_DEVICE:-cpu}
      ASR_MAX_CONCURRENT_INFERENCE: ${ASR_MAX_CONCURRENT_INFERENCE:-1}
      ASR_QUEUE_SIZE: ${ASR_QUEUE_SIZE:-64}
      ASR_CPU_THREADS: ${ASR_CPU_THREADS:-0}
      # Какая модель активна, выбирается в админке (Интеграции → Распознавание речи); здесь — только запасной вариант до первого выбора.
      ASR_MODEL_ID: ${ASR_MODEL_ID:-gigaam-v3-e2e-rnnt-full}
      ASR_GGUF_BIN: ${ASR_GGUF_BIN:-transcribe}
      ASR_GGUF_ARGS: ${ASR_GGUF_ARGS:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      ASR_INTEROP_THREADS: ${ASR_INTEROP_THREADS:-0}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-ru}
      ASR_VAD_THRESHOLD: ${ASR_VAD_THRESHOLD:-0.5}
      ASR_VAD_END_SILENCE_MS: ${ASR_VAD_END_SILENCE_MS:-700}
      ASR_VAD_MIN_SPEECH_MS: ${ASR_VAD_MIN_SPEECH_MS:-250}
      ASR_VAD_PAD_MS: ${ASR_VAD_PAD_MS:-200}
      ASR_MAX_SEGMENT_SECONDS: ${ASR_MAX_SEGMENT_SECONDS:-20}
      RECORDINGS_DIR: /data/recordings
    volumes:
      - ${DATA_ROOT}/models:/models:ro
      - ${DATA_ROOT}/recordings:/data/recordings
    healthcheck:
      # Лёгкая проверка процесса; готовность модели — /readyz (без инференса).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 120s
    stop_grace_period: 20s
    cpu_shares: 512       # вес при конкуренции за процессор (не лимит): звонок важнее распознавания, но распознавание во время встречи не отключается
    logging: *default-logging

  # SIP-телефония: LiveKit SIP Service (профиль `sip`, по умолчанию не запускается и порты не публикуются). Связан с LiveKit через общий Redis (db 1).
  # Включение — scripts/sip.sh enable / кнопка в админке. SIP signalling и RTP — отдельные порты для АТС; браузерные участники их не используют.
  livekit-sip:
    profiles: ["sip"]
    image: ${SIP_IMAGE:-livekit/sip:v1.20.0@sha256:e675638b7678eadb19d48c7a8865149d1b7c23a95b2e3c6fae173684d70c62fc}
    restart: unless-stopped
    depends_on:
      livekit:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${SIP_BIND_ADDR:-0.0.0.0}:${SIP_SIGNALING_PORT:-5060}:${SIP_SIGNALING_PORT:-5060}/udp"
      - "${SIP_BIND_ADDR:-0.0.0.0}:${SIP_SIGNALING_PORT:-5060}:${SIP_SIGNALING_PORT:-5060}/tcp"
      - "${SIP_BIND_ADDR:-0.0.0.0}:${SIP_RTP_START:-20000}-${SIP_RTP_END:-20100}:${SIP_RTP_START:-20000}-${SIP_RTP_END:-20100}/udp"
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:?}
        api_secret: ${LIVEKIT_API_SECRET:?}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD:?}
          db: 1
        sip_port: ${SIP_SIGNALING_PORT:-5060}
        rtp_port: ${SIP_RTP_START:-20000}-${SIP_RTP_END:-20100}
        health_port: 8081
        use_external_ip: false
        nat_1_to_1_ip: ${SIP_MEDIA_IP:-${LIVEKIT_NODE_IP}}
        media_nat_1_to_1_ip: ${SIP_MEDIA_IP:-${LIVEKIT_NODE_IP}}
        logging:
          level: info
    logging: *default-logging

  # Видеозапись встреч: LiveKit Egress (профиль `video`, по умолчанию не запускается). Внутри — браузер Chrome, который «смотрит» комнату и кодирует MP4 (H.264 + AAC),
  # поэтому службе нужны процессор (≈ 2–4 ядра на запись) и право SYS_ADMIN для песочницы браузера. Портов наружу нет: служба получает задания через общий Redis
  # (db 1, как у SIP) и пишет файлы в том записей (/out = ${DATA_ROOT}/recordings, тот же каталог, что у backend). Включение — scripts/video.sh enable / «Администрирование → Видеозапись».
  livekit-egress:
    profiles: ["video"]
    image: ${VIDEO_IMAGE:-livekit/egress:v1.15.0@sha256:ac244a40268ce1dd1510fbff6eb529609ec68aceff1602343f79be8ca08c355b}
    restart: unless-stopped
    depends_on:
      livekit:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Запуск от того же uid, что backend и ASR (10001): иначе Egress создаёт каталоги встречи от uid 1001 с правами 755, и backend не сможет удалить видеофайл, а звук
    # не сможет писаться в уже созданную папку встречи (проверено на настоящем Egress). Домашний каталог — в памяти, образ Egress ждёт там пользователя egress.
    user: "10001:0"
    # Egress держит в /home/egress/tmp весь файл записи до конца задания, путь зашит в нём (tmp_dir перезаписывается). В памяти этот файл убивал эфир 1080p на 52-й минуте
    # и пропадал. Поэтому каталог уводится на том трансляций: локальный диск, том записей не годится (на SMB нет сокета IPC). entrypoint.sh образа чистит его при запуске.
    # Браузер, наоборот, остаётся в памяти: его профиль лежал бы там же, а на занятом диске запуск растягивался до 35 с при пределе 20 с. Обёртка стоит раньше по PATH.
    entrypoint:
      - /tini
      - --
      - sh
      - -ec
      - |
        mkdir -p /live/tmp /home/egress/bin /home/egress/chrome
        ln -sfn /live/tmp /home/egress/tmp
        cat > /home/egress/bin/google-chrome <<'WRAP'
        #!/bin/sh
        d=/home/egress/chrome/$$$$
        mkdir -p "$$d"
        TMPDIR="$$d" exec /usr/bin/google-chrome "$$@" --user-data-dir="$$d"
        WRAP
        chmod +x /home/egress/bin/google-chrome
        PATH=/home/egress/bin:$$PATH exec /entrypoint.sh
    tmpfs:
      - /home/egress:uid=10001,gid=0,mode=0770,size=2g,exec
    cap_add:
      - SYS_ADMIN
    environment:
      HOME: /home/egress
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:?}
        api_secret: ${LIVEKIT_API_SECRET:?}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD:?}
          db: 1
        health_port: 8082
        # Метрики для диагностики эфира (нагрузка, память, очереди записи). Порт слушает только внутри сети проекта и наружу не публикуется.
        prometheus_port: 9090
        log_level: info
        cpu_cost:
          room_composite_cpu_cost: ${VIDEO_CPU_COST:-3.0}
        latency:                # замерено на настоящем Egress: 7 мс расхождения звука и изображения вместо 90; pipeline меньше 1,5 с даёт сбой GStreamer «clock problem»
          jitter_buffer_latency: 1s
          audio_mixer_latency: 1s
          pipeline_latency: 1500ms
    volumes:
      - ${DATA_ROOT}/recordings:/out
      - ${DATA_ROOT}/live:/live          # сегменты HLS прямых эфиров: Egress пишет, backend создаёт ссылки доступа и убирает, web (nginx) раздаёт
    healthcheck:
      # Попутно — счётчик процессора контейнера для диагностики эфира: приложению не выдаётся сокет Docker, другого способа увидеть загрузку этой службы (Chrome и кодировщик) у него нет.
      # Там же уборка: Egress оставляет пустой каталог на каждое задание и блокировку Xvfb, а после аварии и файлы. Срок файлов больше предела эфира в 48 часов.
      test: ["CMD-SHELL", "find /live/tmp -mindepth 2 ! -type d -mmin +2900 -delete 2>/dev/null; for d in /home/egress/chrome/*; do [ -d \"/proc/$${d##*/}\" ] || rm -rf \"$$d\"; done; find /live/tmp -mindepth 1 -type d -empty -mmin +120 -delete 2>/dev/null; find /tmp -maxdepth 1 -name '.X*-lock' -mmin +2880 -delete 2>/dev/null; cat /sys/fs/cgroup/cpu.stat > /live/diag/egress.cpu 2>/dev/null; wget -q -O /dev/null http://127.0.0.1:8082/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s      # активные записи при остановке службы дописываются и закрываются
    shm_size: "1gb"             # Chrome без достаточной общей памяти падает на тяжёлых страницах
    cpu_shares: 8192            # наравне с LiveKit: распознавание и языковая модель не должны лишать браузер процессора, он обязан подняться за 20 с
    logging: *default-logging

  # Низкая задержка эфира: Egress отдаёт сюда внутренний RTMP, MediaMTX делает из него LL-HLS без перекодирования (замер: 2,9 с до плеера против 7,5 с у сегментов Egress).
  # Падение службы не трогает запись и площадки: плеер уходит на обычный HLS. Наружу портов нет, зрители идут через nginx с подписью.
  mediamtx:
    profiles: ["lowlat"]
    image: ${MEDIAMTX_IMAGE:-bluenviron/mediamtx:1.21.3@sha256:59e43552f3be43695b70c19424dc2a42fcec18075f88d91561a24ac5d70a586c}
    restart: unless-stopped
    environment:
      MTX_HLSVARIANT: lowLatency
      MTX_HLSSEGMENTDURATION: 1s
      MTX_HLSPARTDURATION: 200ms
      MTX_HLSSEGMENTCOUNT: "7"
      MTX_HLSALWAYSREMUX: "yes"
      MTX_RTSP: "no"
      MTX_WEBRTC: "no"
      MTX_SRT: "no"
      MTX_LOGLEVEL: warn
    logging: *default-logging

  web:
    build:
      context: ../frontend
      network: ${BUILD_NETWORK:-default}   # сеть шагов RUN при сборке; host — если источники доступны только из сети хоста (scripts/lib/netcheck.sh)
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
        APP_GIT_COMMIT: ${APP_GIT_COMMIT:-unknown}
        APP_BUILT_AT: ${APP_BUILT_AT:-unknown}
    image: ${COMPOSE_PROJECT_NAME}-web:${IMAGE_TAG}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true      # процесс в контейнере не может получить больше прав (setuid и т. п.); на работу сервиса не влияет
    depends_on:
      backend:
        condition: service_healthy
    # Общая группа 10001 с backend: секрет подписи HLS (live/nginx/secret.conf, 0640, группа 10001) nginx читает, а прочие локальные пользователи сервера — нет.
    group_add: ["10001"]
    volumes:
      - ${DATA_ROOT}/live:/live:ro                        # HLS прямых эфиров раздаёт nginx напрямую
      - ${DATA_ROOT}/live/nginx:/etc/nginx/live:ro        # секрет подписи ссылок (set $hls_secret), его пишет backend; применяет 40-live-secret.sh (nginx -t, reload)
    ports:
      - "${WEB_BIND_ADDR:?}:${WEB_PORT:?}:8080/tcp"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

networks:
  default: {}
