# Compose-описание ОДНОГО экземпляра системы.
#
# Запускать только через scripts/*.sh (они задают --project-directory, --env-file
# и -p ${COMPOSE_PROJECT_NAME}). Имена контейнеров, сетей и volumes НЕ
# фиксируются: compose строит их из COMPOSE_PROJECT_NAME, поэтому два экземпляра
# и чужие проекты на одном хосте не конфликтуют.
#
# Порты хоста — только из переменных БЕЗ значений по умолчанию (${VAR:?...}):
# незаполненная переменная = отказ запуска, а не молчаливый захват порта.
# PostgreSQL и Redis не публикуются.

name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env: &app-env
  # APP_VERSION/APP_GIT_COMMIT/APP_BUILT_AT намеренно НЕ передаются при запуске: они запечены в образ при сборке
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:?}
  POSTGRES_USER: ${POSTGRES_USER:?}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?}
  LIVEKIT_INTERNAL_URL: ws://livekit:7880
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ${DATA_ROOT:?DATA_ROOT is required}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true      # процесс в контейнере не может получить больше прав (setuid и т. п.); на работу сервиса не влияет
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes", "--save", "60", "1000"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - ${DATA_ROOT}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  livekit:
    build:
      context: ./livekit
      args:
        LIVEKIT_IMAGE_TAG: ${LIVEKIT_IMAGE_TAG:?}
    image: ${COMPOSE_PROJECT_NAME}-livekit:${LIVEKIT_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy       # нужен, когда включена SIP-телефония (общая шина LiveKit ↔ SIP)
    # Внутренние порты ICE равны опубликованным: LiveKit сообщает клиентам
    # именно эти значения в ICE-кандидатах, расхождение ломает подключение.
    ports:
      - "127.0.0.1:${LIVEKIT_HTTP_PORT:?}:7880/tcp"
      - "${LIVEKIT_BIND_ADDR:?}:${LIVEKIT_TCP_PORT:?}:${LIVEKIT_TCP_PORT}/tcp"
      - "${LIVEKIT_BIND_ADDR}:${LIVEKIT_UDP_PORT:?}:${LIVEKIT_UDP_PORT}/udp"
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        # Метрики для «Администрирование → Производительность» (трафик, число потоков). Порт слушает только внутри сети проекта и наружу не публикуется.
        prometheus_port: 6789
        rtc:
          tcp_port: ${LIVEKIT_TCP_PORT}
          udp_port: ${LIVEKIT_UDP_PORT}
          use_external_ip: false
          node_ip: ${LIVEKIT_NODE_IP:?}
        ${LIVEKIT_REDIS_LINE:-}
        room:
          # Не закрывать комнату мгновенно: обновление страницы и краткий обрыв сети не должны её удалять.
          departure_timeout: ${LIVEKIT_ROOM_DEPARTURE_TIMEOUT:-60}
          empty_timeout: ${LIVEKIT_ROOM_EMPTY_TIMEOUT:-300}
        keys:
          ${LIVEKIT_API_KEY:?}: ${LIVEKIT_API_SECRET:?}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://backend:8000/internal/v1/livekit/webhook
    # Приоритет звонка при нехватке процессора: вес (не лимит!) выше обычного — при свободном процессоре ничего не меняется, а при конкуренции с распознаванием
    # речи и языковой моделью LiveKit получает долю в первую очередь. Много открытых соединений зрителей: запас дескрипторов файлов.
    cpu_shares: 2048
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7880/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  backend:
    build:
      context: ../backend
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
        APP_GIT_COMMIT: ${APP_GIT_COMMIT:-unknown}
        APP_BUILT_AT: ${APP_BUILT_AT:-unknown}
    image: ${COMPOSE_PROJECT_NAME}-backend:${IMAGE_TAG:?}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true      # процесс в контейнере не может получить больше прав (setuid и т. п.); на работу сервиса не влияет
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    environment:
      <<: *app-env
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?}
      APP_MASTER_KEY: ${APP_MASTER_KEY:?}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:?}
      LIVEKIT_TOKEN_TTL_SECONDS: ${LIVEKIT_TOKEN_TTL_SECONDS:-300}
      LIVEKIT_SERVER_VERSION: ${LIVEKIT_IMAGE_TAG:-unknown}
      ASR_INTERNAL_URL: http://asr:8090
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:-}
      LIVEKIT_RTC_TCP_PORT: ${LIVEKIT_TCP_PORT:-0}
      LIVEKIT_RTC_UDP_PORT: ${LIVEKIT_UDP_PORT:-0}
      # LDAP_* необязательны: каталог подключается в веб-интерфейсе (Администрирование → LDAP и доступ); эти значения — прежний способ
      LDAP_URIS: ${LDAP_URIS:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_CA_FILE: /run/secrets/ldap-ca.pem
      LDAP_LOGIN_ATTRIBUTE: ${LDAP_LOGIN_ATTRIBUTE:-sAMAccountName}
      LDAP_DISPLAY_NAME_ATTRIBUTE: ${LDAP_DISPLAY_NAME_ATTRIBUTE:-displayName}
      LDAP_ADMIN_GROUP_DN: ${LDAP_ADMIN_GROUP_DN:-}
      LDAP_ACCESS_GROUP_DN: ${LDAP_ACCESS_GROUP_DN:-}
      LDAP_TIMEOUT_SECONDS: ${LDAP_TIMEOUT_SECONDS:-5}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.0/8,::1/128}
      SESSION_IDLE_TIMEOUT_SECONDS: ${SESSION_IDLE_TIMEOUT_SECONDS:-28800}
      SESSION_ABSOLUTE_TIMEOUT_SECONDS: ${SESSION_ABSOLUTE_TIMEOUT_SECONDS:-86400}
      LOGIN_MAX_FAILURES_PER_USER: ${LOGIN_MAX_FAILURES_PER_USER:-20}
      LOGIN_MAX_FAILURES_PER_IP: ${LOGIN_MAX_FAILURES_PER_IP:-60}
      LOGIN_FAILURE_WINDOW_SECONDS: ${LOGIN_FAILURE_WINDOW_SECONDS:-900}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-300}
      DEFAULT_TEXT_RETENTION_DAYS: ${DEFAULT_TEXT_RETENTION_DAYS:-365}
      DEFAULT_AUDIO_RETENTION_DAYS: ${DEFAULT_AUDIO_RETENTION_DAYS:-30}
      MEETING_END_GRACE_SECONDS: ${MEETING_END_GRACE_SECONDS:-30}
      DATA_DIR: /data
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      # локальная LLM (контейнер llm-local, профиль llm): внутренний адрес и каталог модели (только чтение — статус, размер, контрольная сумма)
      SIP_ENABLED: ${SIP_ENABLED:-no}
      SIP_SIGNALING_PORT: ${SIP_SIGNALING_PORT:-5060}
      SIP_RTP_START: ${SIP_RTP_START:-20000}
      SIP_RTP_END: ${SIP_RTP_END:-20100}
      SIP_MEDIA_IP: ${SIP_MEDIA_IP:-}
      SIP_ALLOWED_CIDRS: ${SIP_ALLOWED_CIDRS:-}
      LOCAL_LLM_URL: http://llm-local:8080
      LOCAL_LLM_MODELS_DIR: /models/llm
      LOCAL_LLM_ENABLED: ${LLM_LOCAL_ENABLED:-yes}
      LOCAL_LLM_MODEL_FILE: ${LLM_MODEL_FILE:-Qwen3-1.7B-Q4_K_M.gguf}
      LOCAL_LLM_MODEL_ALIAS: ${LLM_MODEL_ALIAS:-qwen3-1.7b-q4_k_m}
      LOCAL_LLM_MODEL_BYTES: ${LLM_MODEL_BYTES:-1282439584}
      LOCAL_LLM_MODEL_SHA256: ${LLM_MODEL_SHA256:-72c5c3cb38fa32d5256e2fe30d03e7a64c6c79e668ad84057e3bd66e250b24fb}
    networks:
      - default
      - llm_internal
    volumes:
      # прежний CA-файл (если задан); пусто — /dev/null: CA загружаются в веб-интерфейсе и лежат в /data/ca
      - ${LDAP_CA_FILE:-/dev/null}:/run/secrets/ldap-ca.pem:ro
      - ${DATA_ROOT}/ca:/data/ca
      - ${DATA_ROOT}/chat-files:/data/chat-files
      # фото профилей и изображения оформления («Настройки сайта»): без постоянного тома пропадали бы при пересоздании контейнера
      - ${DATA_ROOT}/avatars:/data/avatars
      - ${DATA_ROOT}/branding:/data/branding
      - ${DATA_ROOT}/exports:/data/exports
      - ${DATA_ROOT}/recordings:/data/recordings
      # обмен с исполнителем обновлений на хосте (scripts/updater.sh): запросы из веб-интерфейса и вывод обновления
      - ${DATA_ROOT}/updater:/data/updater
      - ${DATA_ROOT}/models/llm:/models/llm:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    logging: *default-logging

  asr:
    build:
      context: ../asr-service
      args:
        TORCH_INDEX_URL: ${ASR_TORCH_INDEX_URL:?}
        GIGAAM_GIT_COMMIT: ${GIGAAM_GIT_COMMIT:?}
        APP_VERSION: ${APP_VERSION:-0.0.0}
        APP_GIT_COMMIT: ${APP_GIT_COMMIT:-unknown}
        APP_BUILT_AT: ${APP_BUILT_AT:-unknown}
    image: ${COMPOSE_PROJECT_NAME}-asr:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    environment:
      <<: *app-env
      ASR_PROVIDER: ${ASR_PROVIDER:-gigaam}
      ASR_MODEL_NAME: ${ASR_MODEL_NAME:-v3_e2e_rnnt}
      ASR_MODEL_DIR: /models/gigaam
      ASR_DEVICE: ${ASR_DEVICE:-cpu}
      ASR_MAX_CONCURRENT_INFERENCE: ${ASR_MAX_CONCURRENT_INFERENCE:-1}
      ASR_QUEUE_SIZE: ${ASR_QUEUE_SIZE:-64}
      ASR_CPU_THREADS: ${ASR_CPU_THREADS:-0}
      # Какая модель активна, выбирается в админке (Интеграции → Распознавание речи); здесь — только запасной вариант до первого выбора.
      ASR_MODEL_ID: ${ASR_MODEL_ID:-gigaam-v3-e2e-rnnt-full}
      ASR_GGUF_BIN: ${ASR_GGUF_BIN:-transcribe}
      ASR_GGUF_ARGS: ${ASR_GGUF_ARGS:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      ASR_INTEROP_THREADS: ${ASR_INTEROP_THREADS:-0}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-ru}
      ASR_VAD_THRESHOLD: ${ASR_VAD_THRESHOLD:-0.5}
      ASR_VAD_END_SILENCE_MS: ${ASR_VAD_END_SILENCE_MS:-700}
      ASR_VAD_MIN_SPEECH_MS: ${ASR_VAD_MIN_SPEECH_MS:-250}
      ASR_VAD_PAD_MS: ${ASR_VAD_PAD_MS:-200}
      ASR_MAX_SEGMENT_SECONDS: ${ASR_MAX_SEGMENT_SECONDS:-20}
      RECORDINGS_DIR: /data/recordings
    volumes:
      - ${DATA_ROOT}/models:/models:ro
      - ${DATA_ROOT}/recordings:/data/recordings
    healthcheck:
      # Лёгкая проверка процесса; готовность модели — /readyz (без инференса).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 120s
    stop_grace_period: 20s
    cpu_shares: 512       # вес при конкуренции за процессор (не лимит): звонок важнее распознавания, но распознавание во время встречи не отключается
    logging: *default-logging

  # SIP-телефония: LiveKit SIP Service (профиль `sip`, по умолчанию не запускается и порты не публикуются). Связан с LiveKit через общий Redis (db 1).
  # Включение — scripts/sip.sh enable / кнопка в админке. SIP signalling и RTP — отдельные порты для АТС; браузерные участники их не используют.
  livekit-sip:
    profiles: ["sip"]
    image: ${SIP_IMAGE:-livekit/sip:v1.13.0}
    restart: unless-stopped
    depends_on:
      livekit:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${SIP_BIND_ADDR:-0.0.0.0}:${SIP_SIGNALING_PORT:-5060}:${SIP_SIGNALING_PORT:-5060}/udp"
      - "${SIP_BIND_ADDR:-0.0.0.0}:${SIP_SIGNALING_PORT:-5060}:${SIP_SIGNALING_PORT:-5060}/tcp"
      - "${SIP_BIND_ADDR:-0.0.0.0}:${SIP_RTP_START:-20000}-${SIP_RTP_END:-20100}:${SIP_RTP_START:-20000}-${SIP_RTP_END:-20100}/udp"
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:?}
        api_secret: ${LIVEKIT_API_SECRET:?}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD:?}
          db: 1
        sip_port: ${SIP_SIGNALING_PORT:-5060}
        rtp_port: ${SIP_RTP_START:-20000}-${SIP_RTP_END:-20100}
        health_port: 8081
        use_external_ip: false
        nat_1_to_1_ip: ${SIP_MEDIA_IP:-${LIVEKIT_NODE_IP}}
        media_nat_1_to_1_ip: ${SIP_MEDIA_IP:-${LIVEKIT_NODE_IP}}
        logging:
          level: info
    logging: *default-logging

  # Локальная LLM (Qwen3 1.7B Q4_K_M): llama.cpp, CPU. OpenAI-совместимый API (/v1/chat/completions) доступен только backend через
  # внутреннюю сеть `llm_internal` (internal: true — у контейнера нет выхода наружу и нет публикуемых портов). Запускается только когда модель на месте
  # и проверена (scripts запускают compose с --profile llm); без модели система работает без него. Модель хранится вне образа: ${DATA_ROOT}/models/llm.
  llm-local:
    profiles: ["llm"]
    image: ${LLM_LOCAL_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b11371}
    restart: unless-stopped
    command:
      - "-m"
      - "/models/${LLM_MODEL_FILE:-Qwen3-1.7B-Q4_K_M.gguf}"
      - "--alias"
      - "${LLM_MODEL_ALIAS:-qwen3-1.7b-q4_k_m}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "${LLM_LOCAL_CTX:-8192}"
      - "-t"
      - "${LLM_LOCAL_THREADS:-4}"
      - "--parallel"
      - "1"
      - "--jinja"
      # Без кэша промптов в памяти: по умолчанию llama-server держит до 8 ГиБ состояний прошлых запросов, и контейнер с лимитом памяти
      # после нескольких протоколов подряд убивается OOM (замерено: RSS 1,6 → 5 ГБ). Протоколы — всегда новые длинные запросы, кэш им не помогает.
      - "--cache-ram"
      - "0"
    volumes:
      - ${DATA_ROOT}/models/llm:/models:ro
    networks:
      - llm_internal
    mem_limit: ${LLM_LOCAL_MEM:-3500m}
    cpu_shares: 256       # вес при конкуренции за процессор (не лимит): протоколы и резюме уступают звонку и распознаванию, а без конкуренции идут на полной скорости
    stop_grace_period: 10s
    logging: *default-logging

  web:
    build:
      context: ../frontend
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
        APP_GIT_COMMIT: ${APP_GIT_COMMIT:-unknown}
        APP_BUILT_AT: ${APP_BUILT_AT:-unknown}
    image: ${COMPOSE_PROJECT_NAME}-web:${IMAGE_TAG}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true      # процесс в контейнере не может получить больше прав (setuid и т. п.); на работу сервиса не влияет
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDR:?}:${WEB_PORT:?}:8080/tcp"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging

networks:
  default: {}
  # internal: true — контейнеры этой сети не имеют маршрута наружу: локальная LLM физически не может отправить данные за пределы сервера
  llm_internal:
    internal: true
